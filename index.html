<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c4a">
<title>Περίπτερο</title>
<style>
:root{
  --bg:#eef1ec;--card:#ffffff;--ink:#1b2421;--mut:#5f6f69;--line:#d3dbd5;
  --g:#1f5c4a;--onp:#ffffff;--amb:#f2a900;--red:#c4402f;--ok:#2e7d4f;
  --font:"Trebuchet MS","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111a17;--card:#1a2521;--ink:#e8efeb;--mut:#93a39c;--line:#2a3933;--g:#58b895;--onp:#0d1613;--red:#e0705f;--ok:#5fc08a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;
  background:var(--g);color:var(--onp);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1*env(safe-area-inset-top,0px))}
.brand{font-weight:700;font-size:19px;letter-spacing:.2px}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.who input{width:130px;min-height:38px;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:16px;background:rgba(255,255,255,.95);color:#1b2421}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:78px;min-height:62px;background:none;border:0;border-top:3px solid transparent;color:var(--mut);font:inherit;font-size:12px;padding:6px 8px;cursor:pointer}
nav button b{display:block;font-size:22px;line-height:1.2;font-weight:400}
nav button.on{color:var(--g);border-top-color:var(--amb);font-weight:700}
h2{margin:0 0 4px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid>input:first-child,.grid>button.primary,.grid>.full{grid-column:1/-1}
input,select,textarea{width:100%;min-height:48px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input:focus,button:focus-visible{outline:3px solid var(--amb);outline-offset:1px}
button{font:inherit;cursor:pointer}
.primary,.ok,.danger,.ghost,.chip{min-height:48px;border-radius:10px;border:1px solid transparent;padding:8px 14px;font-weight:700}
.primary{background:var(--g);color:var(--onp)}
.ok{background:var(--ok);color:#fff}
.danger{background:none;color:var(--red);border-color:var(--red)}
.ghost{background:none;color:var(--g);border-color:var(--line)}
.chip{min-height:40px;background:var(--card);border-color:var(--line);color:var(--ink);font-weight:400}
.chip.on{background:var(--g);color:var(--onp);border-color:var(--g)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .t{font-weight:700;overflow-wrap:anywhere}
.muted,.by{color:var(--mut);font-size:14px}
.by{font-weight:400}
.sm{min-height:44px;min-width:44px;padding:4px 10px;font-size:18px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.big{font-size:34px;font-weight:700}
.owe{color:var(--red)}
.pos{color:var(--ok)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--line);color:var(--ink)}
.badge.warn{background:var(--amb);color:#1b2421}
.badge.bad{background:var(--red);color:#fff}
.done .t{text-decoration:line-through;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.stock{min-width:118px}
.stock.out{background:var(--red);color:#fff}
.stock.in{background:var(--ok);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2421;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
#toast.show{opacity:1}
a{color:var(--g);font-weight:700}
.sync{font-size:12px;opacity:.9}
.who button{min-height:38px;border:0;border-radius:8px;padding:6px 12px;background:rgba(255,255,255,.2);color:inherit;font-weight:700}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet p{margin:0 0 14px}
.fld{display:block;margin-bottom:10px;font-size:14px;color:var(--mut)}
.fld input,.fld select{margin-top:4px}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .sm{flex:none}
#toast button{margin-left:10px;background:var(--amb);color:#1b2421;border:0;border-radius:8px;padding:6px 12px;font-weight:700;min-height:36px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.blur b,.blur .big{filter:blur(7px);user-select:none}
.chip.tg{min-height:34px;padding:2px 12px;font-size:14px}
.ptags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sum{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div><div class="brand">Περίπτερο</div><div id="sync" class="sync"></div></div>
  <div id="hdr" class="who"></div>
</header>
<main id="main"></main>
<nav id="nav" aria-label="Ενότητες"></nav>
<div id="toast" role="status"></div>

<script>
/* ====== ΡΥΘΜΙΣΕΙΣ FIREBASE ====== */
const FIREBASE_DB_URL  = 'https://peri-a7907-default-rtdb.europe-west1.firebasedatabase.app';   // π.χ. https://ΟΝΟΜΑ-default-rtdb.europe-west1.firebasedatabase.app
const FIREBASE_API_KEY = 'AIzaSyDVOH07_oS1fpNW78nAu9c5XLxdTZC50wA';   // Firebase → Project settings → Web API Key
const ADMIN_NAME = 'peri';     // όνομα διαχειριστή (αν το αλλάξεις, άλλαξε και τους κανόνες στο README)
const SALT = 'peripteros!';    // προστίθεται αθέατα στον κωδικό, επειδή το Firebase θέλει 6+ χαρακτήρες
/* ======================================================== */
const DB = FIREBASE_DB_URL.replace(/\/+$/, ''), AUTH = !!(DB && FIREBASE_API_KEY);
const SKEY = 'peripteros-session', BKEY = 'peripteros-base';
try{ localStorage.removeItem('peripteros-files'); }catch(e){}
let lastSub = {s:'', t:0}, openSup = null, supView = 'order';
let session = null, tok = {id:'', exp:0}, users = null;
const KEY = 'peripteros-v1';
const blank = () => ({user:'', products:[], expiry:[], needs:[], cash:[], debtors:[], entries:[], contacts:[], receipts:[], zs:[], expenses:[], suppliers:[], sprices:[], spay:[], tasks:[]});
function migrate(s){ s.entries = s.entries || []; s.debtors.forEach(c => { if(Array.isArray(c.entries)){ c.entries.forEach(e => s.entries.push({...e, debtor:c.id})); delete c.entries; } });
  (s.expiry || []).forEach(e => s.products.push({id:'x' + e.id, name:e.name, exp:e.date, by:e.by})); s.expiry = []; delete s.cigs; return s; }
function load(){ try{ return migrate(Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {})); }catch(e){ return blank(); } }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Δεν έγινε αποθήκευση!'); } sync(); }

let tab = 'home', hideAmts = false, tagsAll = false, needsView = 'list', openDebtor = null, editId = null, q = '', ptag = '', repPeriod = 'month', cashView = 'count';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = v => { const n = parseFloat(String(v || '').replace(',', '.')); return isNaN(n) ? null : n; };
const eur = n => n == null ? '' : n.toLocaleString('el-GR', {style:'currency', currency:'EUR'});
const dt = t => new Date(t).toLocaleString('el-GR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
const dd = s => new Date(s + 'T00:00:00').toLocaleDateString('el-GR');
const who = () => AUTH ? (session ? session.name : '') : S.user.trim();
const isAdmin = () => !AUTH || (!!session && session.role === 'admin');
const canDel = x => isAdmin() || (!!x && !!x.by && x.by === who());
const delBtn = (act, x) => canDel(x) ? `<button class="danger sm" data-act="${act}" data-id="${x.id}" aria-label="Διαγραφή">✕</button>` : '';
const tag = x => (x.by ? ` <span class="by">– ${esc(x.by)}</span>` : '') + (x.ed && x.ed !== x.by ? ` <span class="by">(επεξ. ${esc(x.ed)})</span>` : '');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const GR = {α:'a', β:'b', γ:'g', δ:'d', ε:'e', ζ:'z', η:'i', θ:'t', ι:'i', κ:'k', λ:'l', μ:'m', ν:'n', ξ:'x', ο:'o', π:'p', ρ:'r', σ:'s', ς:'s', τ:'t', υ:'i', φ:'f', χ:'x', ψ:'ps', ω:'o'};
function pk(s){
  s = String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  s = s.replace(/ου/g, 'u').replace(/αυ/g, 'av').replace(/ευ/g, 'ev').replace(/μπ/g, 'b').replace(/ντ/g, 'd').replace(/γκ|γγ/g, 'g').replace(/τσ/g, 'ts').replace(/αι/g, 'e').replace(/ει|οι/g, 'i');
  s = s.replace(/[α-ω]/g, c => GR[c] || c);
  return s.replace(/ph/g, 'f').replace(/ch/g, 'x').replace(/th/g, 't').replace(/ou|oo/g, 'u').replace(/ee|ei|oi|y/g, 'i').replace(/ai/g, 'e').replace(/qu|q|ck|c/g, 'k').replace(/v/g, 'b').replace(/w/g, 'u').replace(/h/g, '').replace(/[^a-z0-9]/g, '').replace(/(.)\1+/g, '$1');
}
const fz = (h, n) => norm(h).includes(norm(n)) || (!!pk(n) && pk(h).includes(pk(n)));
const match = s => !q || fz(s, q);
const val = (f, n) => (f.get(n) || '').trim();
const empty = t => `<div class="empty">${t}</div>`;
const tagsOf = p => String(p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
const normTags = s => { const seen = new Set(), out = []; String(s || '').split(/[,;]/).forEach(t => { t = t.trim(); const k = norm(t); if(t && !seen.has(k)){ seen.add(k); out.push(t); } }); return out.join(', '); };
const allTags = () => { const m = {}; S.products.forEach(p => tagsOf(p).forEach(t => { const k = norm(t); if(!m[k]) m[k] = t; })); return Object.values(m).sort((a, b) => a.localeCompare(b, 'el')); };
const tagChips = cur => { const set = new Set(tagsOf({tags:cur}).map(norm)), l = allTags(); return l.length ? `<div class="tags full">${l.map(t => `<button type="button" class="chip tg ${set.has(norm(t)) ? 'on' : ''}" data-act="tagpick" data-id="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''; };
const syncTags = fm => { const inp = fm.querySelector('[name=tags]'), set = new Set(tagsOf({tags:inp.value}).map(norm)); fm.querySelectorAll('[data-act=tagpick]').forEach(c => c.classList.toggle('on', set.has(norm(c.dataset.id)))); };
const today = () => toLocal(Date.now()).slice(0, 10);
const srcOf = x => x && x.src === 'bank' ? 'bank' : 'cash';
const srcLabel = k => k === 'bank' ? 'Τράπεζα (POS)' : 'Ταμείο (μετρητά)';
const srcOpts = [['cash', 'Πληρώθηκε από το ταμείο (μετρητά)'], ['bank', 'Πληρώθηκε από τράπεζα (POS)']];
const srcSelect = () => `<select class="full" name="src" aria-label="Πηγή πληρωμής">${srcOpts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`;
const EXPCATS = ['Μισθοί', 'ΔΕΗ', 'ΟΤΕ / Internet', 'Νερό', 'Ενοίκιο', 'Φόροι / Ασφαλιστικά', 'Λογιστής', 'Άλλο'];
const supName = id => (S.suppliers.find(x => x.id === id) || {}).name || '';
const supSelect = req => `<select class="full" name="supplier" aria-label="Προμηθευτής" ${req ? 'required' : ''}><option value="">${req ? '— Διάλεξε προμηθευτή —' : '— Προμηθευτής (προαιρετικό) —'}</option>${S.suppliers.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`;
const supOpts = () => [['', '— χωρίς προμηθευτή —'], ...S.suppliers.map(x => [x.id, x.name])];
const supBal = id => S.receipts.filter(r => r.supplier === id).reduce((t, r) => t + ((r.total ?? r.amount) || 0) - (r.amount || 0), 0) - S.spay.filter(p => p.supplier === id).reduce((t, p) => t + (p.amount || 0), 0);
const DAYS = ['κυρ', 'δευ', 'τρι', 'τετ', 'πεμ', 'παρ', 'σαβ'], DAYN = ['Κυριακή', 'Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή', 'Σάββατο'];
function nextDelivery(sp){
  const ds = String(sp.days || '').split(/[,\s;]+/).map(w => DAYS.indexOf(norm(w).slice(0, 3))).filter(i => i >= 0);
  for(let i = 0; ds.length && i < 8; i++){ const d = new Date(); d.setDate(d.getDate() + i); if(ds.includes(d.getDay())) return i === 0 ? 'σήμερα' : i === 1 ? 'αύριο' : DAYN[d.getDay()] + ' ' + d.toLocaleDateString('el-GR', {day:'2-digit', month:'2-digit'}); }
  return '';
}
const needRow = n => `<div class="item row ${n.done ? 'done' : ''}"><div><div class="t">${esc(n.text)}${tag(n)}${n.supplier && !openSup ? ` <span class="badge">${esc(supName(n.supplier))}</span>` : ''}</div>${n.done && n.od ? `<div class="by">παραγγέλθηκε ${dt(n.od)}</div>` : ''}</div>
  <div class="row"><button class="chip" data-act="needDone" data-id="${n.id}">${n.done ? 'Επαναφορά' : 'Παραγγέλθηκε'}</button>${editBtn('needEdit', n)}${delBtn('needDel', n)}</div></div>`;
const expName = e => e.cat + (e.note ? ' – ' + e.note : '');
let tt;
function toast(m, act){
  const el = $('#toast'); el.innerHTML = esc(m) + (act ? ` <button id="tact">${esc(act.label)}</button>` : '');
  el.style.pointerEvents = act ? 'auto' : 'none'; el.classList.add('show');
  if(act) $('#tact').onclick = () => { act.fn(); el.classList.remove('show'); };
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), act ? 6000 : 1800);
}
const mk = html => { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = html; document.body.appendChild(m); return m; };
function ask(msg, yes = 'Συνέχεια'){
  return new Promise(res => {
    const m = mk(`<div class="sheet"><p>${esc(msg)}</p><div class="row"><button class="ghost" data-r="0">Άκυρο</button><button class="danger" data-r="1">${esc(yes)}</button></div></div>`);
    m.onclick = e => { const b = e.target.closest('[data-r]'); if(b || e.target === m){ m.remove(); res(!!b && b.dataset.r === '1'); } };
  });
}
function fieldHtml(f, vals){
  if(f.options) return `<select name="${f.name}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${String(vals[f.name] ?? '') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const inp = `<input name="${f.name}" type="${f.type || 'text'}" ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} value="${esc(vals[f.name] ?? '')}" ${f.required ? 'required' : ''} autocomplete="off">`;
  return f.chips ? `<div style="width:100%">${inp}${tagChips(vals[f.name] || '')}</div>` : inp;
}
function formModal(title, fields, vals = {}, okLabel = 'Αποθήκευση'){
  return new Promise(res => {
    const m = mk(`<form class="sheet"><h2>${esc(title)}</h2>${fields.map(f => `<label class="fld">${esc(f.label)}<div class="inrow">${fieldHtml(f, vals)}</div></label>`).join('')}
      <div class="row" style="margin-top:6px"><button type="button" class="ghost" data-cancel>Ακύρωση</button><button class="primary">${esc(okLabel)}</button></div></form>`);
    const close = v => { m.remove(); res(v); };
    m.querySelector('form').onsubmit = e => { e.preventDefault(); const o = {}; new FormData(e.target).forEach((v, k) => o[k] = String(v).trim()); close(o); };
    m.querySelector('[data-cancel]').onclick = () => close(null);
    m.onclick = e => { if(e.target === m) close(null); };
    const first = m.querySelector('input'); if(first && !first.value) setTimeout(() => first.focus(), 50);
  });
}
const toLocal = ts => { const d = new Date(ts); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const editBtn = (act, x) => `<button class="chip sm" data-act="${act}" data-id="${x.id}" aria-label="Επεξεργασία">✎</button>`;
function delItem(col, id){
  const i = S[col].findIndex(x => x.id === id); if(i < 0) return;
  const [it] = S[col].splice(i, 1);
  save(); render();
  toast('Διαγράφηκε', {label:'Αναίρεση', fn:() => { S[col].push(it); save(); render(); }});
}

const TABS = [
  ['home','🏠','Σήμερα'],
  ['prod','📦','Προϊόντα'],
  ['debt','👥','Βερεσέ'],
  ['cash','💰','Ταμείο'],
  ['recv','🚚','Παραλαβές'],
  ['needs','📝','Ελλείψεις'],
  ['menu','☰','Μενού'],
];
const MENU = [['z','🧮','Ζ ημέρας'], ['exp','🧾','Έξοδα'], ['fin','📊','Οικονομική εικόνα'], ['sup','🏭','Προμηθευτές'], ['tel','📞','Τηλέφωνα'], ['backup','⚙️','Ρυθμίσεις']];
const cur = () => MENU.some(m => m[0] === tab) ? 'menu' : tab;
function vMenu(){
  return `<h2 style="margin-bottom:10px">Μενού</h2>` + MENU.filter(m => !['exp', 'fin'].includes(m[0]) || isAdmin()).map(([k, i, l]) => `<button class="item row" data-tab="${k}" style="width:100%;min-height:56px;color:var(--ink);cursor:pointer;text-align:left"><span class="t">${i} ${l}</span><span class="muted">›</span></button>`).join('');
}

/* ---------- Ελλείψεις ---------- */
const inNeeds = n => S.needs.some(x => !x.done && pk(x.text) === pk(n));
const pnList = sid => `<datalist id="pn">${[...new Set(S.sprices.filter(x => !sid || x.supplier === sid).map(x => x.name))].map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
function vNeeds(){
  return `<div class="tools">${[['list', 'Λίστα ελλείψεων'], ['cat', 'Προϊόντα προμηθευτών']].map(([k, l]) => `<button class="chip ${needsView === k ? 'on' : ''}" data-act="nview" data-id="${k}">${l}</button>`).join('')}</div>` + (needsView === 'cat' ? vCat() : vNeeds0());
}
function vCat(){
  const l = S.sprices.filter(x => match(x.name + ' ' + supName(x.supplier))).sort((a, b) => a.name.localeCompare(b.name, 'el'));
  return `<input data-search placeholder="Αναζήτηση προϊόντος…" value="${esc(q)}" style="margin-bottom:10px">` +
    (l.length ? l.map(x => `<div class="item row"><div><div class="t">${esc(x.name)}</div><div class="by">${esc(supName(x.supplier))}${x.price != null ? ' · ' + eur(x.price) : ''}</div></div><button class="${inNeeds(x.name) ? 'ghost' : 'primary'}" data-act="needAdd" data-id="${x.id}">${inNeeds(x.name) ? '✓ Λείπει' : '＋ Ελλείψεις'}</button></div>`).join('') : empty(S.sprices.length ? 'Κανένα αποτέλεσμα.' : 'Πρόσθεσε προϊόντα μέσα στους προμηθευτές.'));
}
function vNeeds0(){
  const open = S.needs.filter(n => !n.done), done = S.needs.filter(n => n.done);
  const row = needRow;
  return `<form data-form="need" class="card grid"><input class="full" name="text" list="pn" placeholder="Τι τελειώνει;" required autocomplete="off">${pnList('')}${supSelect()}<button class="primary">Προσθήκη</button></form>
  <div class="tools"><button class="ghost" data-act="needCopy">Αντιγραφή λίστας</button>${done.length && isAdmin() ? '<button class="ghost" data-act="needClear">Καθάρισμα παραγγελμένων</button>' : ''}</div>
  ${open.length ? open.map(row).join('') : empty('Δεν λείπει τίποτα.')}
  ${done.length ? `<h2 class="muted" style="font-size:15px;margin-top:16px">Παραγγέλθηκαν</h2>${done.map(row).join('')}` : ''}`;
}

/* ---------- Σήμερα ---------- */
const OVERDUE_DAYS = 30;
const daysAgo = d => Math.floor((Date.now() - new Date(d + 'T00:00:00')) / 864e5);
function fifo(ch, paid){
  ch = ch.map(c => ({...c})).sort((a, b) => a.d.localeCompare(b.d)); let left = paid;
  ch.forEach(c => { const k = Math.min(left, c.v); c.v -= k; left -= k; });
  const o = ch.filter(c => c.v > 0.005);
  return {bal:o.reduce((s, c) => s + c.v, 0), age:o.length ? daysAgo(o[0].d) : 0};
}
const debtorAge = c => { const es = S.entries.filter(e => e.debtor === c.id); return fifo(es.filter(e => (e.amount || 0) > 0).map(e => ({d:toLocal(e.at).slice(0, 10), v:e.amount})), -es.filter(e => (e.amount || 0) < 0).reduce((s, e) => s + e.amount, 0)); };
const supAge = x => fifo(S.receipts.filter(r => r.supplier === x.id && ((r.total ?? r.amount) || 0) - (r.amount || 0) > 0).map(r => ({d:r.date, v:(r.total ?? r.amount) - r.amount})), S.spay.filter(p => p.supplier === x.id).reduce((s, p) => s + (p.amount || 0), 0));
function vHome(){
  const t = today(), zt = S.zs.filter(z => z.date === t);
  const tz = zt.reduce((s, z) => s + (z.z || 0), 0), tp = zt.reduce((s, z) => s + (z.pos || 0), 0);
  const lz = [...S.zs].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.at - a.at)[0], lc = [...S.cash].sort((a, b) => b.at - a.at)[0];
  const open = S.needs.filter(n => !n.done), ord = S.needs.filter(n => n.done);
  const tasks = S.tasks.filter(x => !x.done).sort((a, b) => a.date.localeCompare(b.date));
  const due = tasks.filter(x => x.date <= t), later = tasks.filter(x => x.date > t).slice(0, 5);
  const deliv = S.suppliers.filter(x => nextDelivery(x) === 'σήμερα');
  const dl = S.debtors.map(c => ({c, ...debtorAge(c)})).filter(r => r.bal > 0.005).sort((a, b) => b.age - a.age);
  const sl = S.suppliers.map(x => ({x, ...supAge(x)})).filter(r => r.bal > 0.005).sort((a, b) => b.age - a.age);
  const card = (h, inner, more) => `<div class="card"><h2>${h}</h2>${inner}${more ? `<button class="ghost" data-act="jumpTab" data-id="${more[0]}" style="width:100%;margin-top:4px">${more[1]}</button>` : ''}</div>`;
  const taskRow = x => `<div class="item row"><div><div class="t">${esc(x.text)}${tag(x)}</div><div class="by">${x.date < t ? '<span class="badge bad">εκπρόθεσμη</span> ' : ''}${dd(x.date)}</div></div><div class="row"><button class="ok sm" data-act="taskDone" data-id="${x.id}" aria-label="Έγινε">✓</button>${delBtn('taskDel', x)}</div></div>`;
  const late = r => r.age > OVERDUE_DAYS ? `<span class="badge bad">${r.age} ημ.</span>` : r.age ? `<span class="by">${r.age} ημ.</span>` : '';
  let h = '';
  if(isAdmin()) h += card('Τζίρος', `<div class="big">${zt.length ? eur(tz + tp) : '—'}</div><div class="muted">${zt.length ? `σήμερα · ταμειακή ${eur(tz)} · POS ${eur(tp)}` : 'Δεν έχει καταχωρηθεί Ζ σήμερα'}</div>
    <div class="sum" style="margin-top:8px"><span>Τελευταίο Ζ${lz ? ' (' + dd(lz.date) + ')' : ''}</span><b>${lz ? eur((lz.z || 0) + (lz.pos || 0)) : '—'}</b></div>
    <div class="sum" style="border:0"><span>Τελευταία καταμέτρηση${lc ? ' (' + dt(lc.at) + ')' : ''}</span><b>${lc ? eur(lc.amount) : '—'}</b></div>`, ['z', 'Ζ ημέρας']);
  h += card('Εργασίες σήμερα', `<form data-form="task" class="grid" style="margin-bottom:8px"><input class="full" name="text" placeholder="Νέα εργασία" required autocomplete="off"><input class="full" name="date" type="date" value="${t}" required aria-label="Ημερομηνία"><button class="primary">Προσθήκη</button></form>
    ${deliv.map(x => `<div class="item row" data-act="hsup" data-id="${x.id}" style="cursor:pointer" tabindex="0"><div class="t">🚚 Παράδοση σήμερα: ${esc(x.name)}</div></div>`).join('')}
    ${due.length ? due.map(taskRow).join('') : (deliv.length ? '' : empty('Καμία εργασία για σήμερα.'))}
    ${later.length ? `<h2 class="muted" style="font-size:14px;margin:10px 0 4px">Επόμενες</h2>` + later.map(taskRow).join('') : ''}`);
  h += card(`Εκκρεμείς παραγγελίες (${ord.length})`, ord.length ? ord.slice(0, 8).map(n => { const sp = S.suppliers.find(x => x.id === n.supplier), nd = sp ? nextDelivery(sp) : '';
    return `<div class="item row" ${sp ? `data-act="hsup" data-id="${sp.id}" style="cursor:pointer" tabindex="0"` : ''}><div><div class="t">${esc(n.text)}</div><div class="by">${sp ? esc(sp.name) : 'χωρίς προμηθευτή'}${n.od ? ' · ' + dd(toLocal(n.od).slice(0, 10)) : ''}${nd ? ' · αναμένεται ' + nd : ''}</div></div></div>`; }).join('') : empty('Καμία εκκρεμής παραγγελία.'), ord.length > 8 ? ['needs', 'Όλες οι ελλείψεις'] : null);
  h += card(`Προϊόντα που τελειώνουν (${open.length})`, open.length ? open.slice(0, 8).map(n => `<div class="item row"><div class="t">${esc(n.text)}${n.supplier ? ` <span class="badge">${esc(supName(n.supplier))}</span>` : ''}</div></div>`).join('') : empty('Δεν λείπει τίποτα.'), open.length ? ['needs', 'Ελλείψεις'] : null);
  h += `<div class="${hideAmts ? 'blur' : ''}">` + card('Χρέη πελατών', `<div class="tools"><button class="chip" data-act="blur">${hideAmts ? '👁 Εμφάνιση ποσών' : '🙈 Απόκρυψη ποσών'}</button></div>` +
    (dl.length ? `<div class="muted" style="margin-bottom:6px">Ληξιπρόθεσμα: ${dl.filter(r => r.age > OVERDUE_DAYS).length} (άνω των ${OVERDUE_DAYS} ημερών)</div>` + dl.slice(0, 6).map(r => `<div class="item row" data-act="hdebt" data-id="${r.c.id}" style="cursor:pointer" tabindex="0"><div class="t">${esc(r.c.name)} ${late(r)}</div><b class="owe">${eur(r.bal)}</b></div>`).join('') : empty('Κανείς δεν χρωστάει.')), dl.length > 6 ? ['debt', 'Όλοι οι πελάτες'] : null) + '</div>';
  h += card('Πληρωμές προμηθευτών', sl.length ? sl.slice(0, 8).map(r => `<div class="item row" data-act="hsup" data-id="${r.x.id}" data-v="pays" style="cursor:pointer" tabindex="0"><div class="t">${esc(r.x.name)} ${late(r)}</div><b class="owe">${eur(r.bal)}</b></div>`).join('') : empty('Δεν οφείλεις σε κανέναν.'), sl.length > 8 ? ['sup', 'Όλοι οι προμηθευτές'] : null);
  return h;
}

/* ---------- Έσοδα / Έξοδα ---------- */
function vFin(){ return isAdmin() ? reportCard() : empty('Μόνο για τον διαχειριστή.'); }
function reportCard(){
  const t = today();
  const start = {day:t, month:t.slice(0, 7) + '-01', year:t.slice(0, 4) + '-01-01', all:''}[repPeriod];
  const inP = d => !start || (d || '') >= start;
  const zs = S.zs.filter(z => inP(z.date));
  const sp = S.receipts.filter(r => inP(r.date)).concat(S.spay.filter(p => inP(p.date)));
  const ex = S.expenses.filter(e => inP(e.date));
  const sum = (l, f) => l.reduce((x, e) => x + (f(e) || 0), 0);
  const Z = sum(zs, z => z.z), P = sum(zs, z => z.pos), C = Z, I = Z + P;
  const SP = sum(sp, e => e.amount), X = sum(ex, e => e.amount), E = SP + X, D = I - E;
  const out = k => sum(sp.concat(ex).filter(e => srcOf(e) === k), e => e.amount);
  const months = {}, mo = k => months[k] = months[k] || {i:0, e:0};
  zs.forEach(z => { if(z.date) mo(z.date.slice(0, 7)).i += (z.z || 0) + (z.pos || 0); });
  sp.concat(ex).forEach(e => { if(e.date) mo(e.date.slice(0, 7)).e += e.amount || 0; });
  const mk2 = Object.keys(months).sort().reverse();
  const cats = {}; ex.forEach(e => cats[e.cat] = (cats[e.cat] || 0) + (e.amount || 0));
  const cl = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const row = (l, v, cls = '', sub = false) => `<div class="sum"${sub ? ' style="padding-left:14px"' : ''}><span class="${sub ? 'by' : ''}">${l}</span><b class="${cls}">${eur(v)}</b></div>`;
  return `<div class="card"><h2>Οικονομική εικόνα</h2>
    <div class="tools" style="margin-top:8px">${[['day', 'Σήμερα'], ['month', 'Μήνας'], ['year', 'Έτος'], ['all', 'Όλα']].map(([k, l]) => `<button class="chip ${repPeriod === k ? 'on' : ''}" data-act="rep" data-id="${k}">${l}</button>`).join('')}</div>
    ${row(`Έσοδα (Ζ, ${zs.length})`, I, 'pos')}
    ${row('Ζ ταμειακής', C, '', true)}${row('Ζ POS', P, '', true)}
    ${row('Έξοδα', E, 'owe')}
    ${row('παραλαβές & πληρωμές προμηθευτών', SP, '', true)}${row('έξοδα (μισθοί, ΔΕΗ…)', X, '', true)}
    ${row('<b>Διαφορά</b>', D, D >= 0 ? 'pos' : 'owe')}
    <h2 class="muted" style="font-size:15px;margin:12px 0 4px">Ανά πηγή</h2>
    ${row('Ταμειακή − πληρωμές από ταμείο', C - out('cash'), C - out('cash') >= 0 ? 'pos' : 'owe')}
    ${row('POS − πληρωμές από τράπεζα', P - out('bank'), P - out('bank') >= 0 ? 'pos' : 'owe')}
    ${cl.length ? `<h2 class="muted" style="font-size:15px;margin:12px 0 4px">Έξοδα ανά κατηγορία</h2>` + cl.map(([k, v]) => row(esc(k), v)).join('') : ''}
    ${mk2.length > 1 ? `<h2 class="muted" style="font-size:15px;margin:12px 0 4px">Ανά μήνα</h2>` + mk2.map(k => { const m = months[k];
      return `<div class="sum"><span>${new Date(k + '-01T00:00:00').toLocaleDateString('el-GR', {month:'long', year:'numeric'})}</span><span class="by">${eur(m.i)} − ${eur(m.e)} = <b class="${m.i - m.e >= 0 ? 'pos' : 'owe'}">${eur(m.i - m.e)}</b></span></div>`; }).join('') : ''}
    <p class="muted" style="margin:10px 0 0">Έσοδα = Ζ ταμειακής + Ζ POS. Έξοδα = παραλαβές (ποσό που πλήρωσες) + πληρωμές προμηθευτών + καρτέλα Έξοδα.</p></div>`;
}

async function editItem(kind, id){
  const col = {need:'needs', cash:'cash', debtor:'debtors', entry:'entries', tel:'contacts', prod:'products', recv:'receipts', z:'zs', exp:'expenses', sup:'suppliers', sprice:'sprices'}[kind];

  if(kind === 'debtor'){ v = await formModal('Μετονομασία πελάτη', [{name:'name', label:'Όνομα', required:1}], {name:x.name}); if(!v) return; if(S.debtors.some(c => c.id !== x.id && norm(c.name) === norm(v.name))) return toast('Υπάρχει ήδη πελάτης με αυτό το όνομα'); x.name = v.name; }
  if(kind === 'cash'){
    v = await formModal('Επεξεργασία ταμείου', [{name:'amount', label:'Ποσό €', inputmode:'decimal', required:1}, {name:'when', label:'Ημερομηνία/ώρα', type:'datetime-local'}], {amount:x.amount, when:toLocal(x.at)});
    if(!v) return; const a = num(v.amount); if(a == null) return toast('Βάλε ποσό');
    x.amount = a; if(v.when) x.at = new Date(v.when).getTime();
  }
  if(kind === 'entry'){
    v = await formModal(x.pay ? 'Επεξεργασία πληρωμής' : 'Επεξεργασία χρέωσης', [{name:'item', label:'Τι πήρε'}, {name:'amount', label:'Ποσό €', inputmode:'decimal'}], {item:x.item, amount:x.amount == null ? '' : Math.abs(x.amount)});
    if(!v) return; const a = num(v.amount);
    if(x.pay){ if(a == null) return toast('Βάλε ποσό'); x.amount = -Math.abs(a); }
    else { if(a == null && !v.item) return toast('Βάλε προϊόν ή ποσό'); x.amount = a == null ? null : Math.abs(a); }
    x.item = v.item;
  }
  if(kind === 'tel'){
    v = await formModal('Επεξεργασία επαφής', [{name:'name', label:'Όνομα', required:1}, {name:'phone', label:'Τηλέφωνο', type:'tel', inputmode:'tel'}, {name:'note', label:'Σημείωση'}], x);
    if(!v) return; x.name = v.name; x.phone = v.phone; x.note = v.note;
  }
  if(kind === 'prod'){
    v = await formModal('Επεξεργασία προϊόντος', [{name:'name', label:'Όνομα προϊόντος', required:1}, {name:'price', label:'Τιμή €', inputmode:'decimal'}, {name:'tags', label:'Ετικέτες (διάλεξε ή γράψε, με κόμμα)', chips:1}], {name:x.name, price:x.price == null ? '' : x.price, tags:x.tags || ''});
    if(!v) return; x.name = v.name; x.price = num(v.price); x.tags = normTags(v.tags);
  }
  if(kind === 'recv'){
    v = await formModal('Επεξεργασία παραλαβής', [{name:'name', label:'Όνομα παραλαβής / τιμολόγιο (προαιρετικό)'}, {name:'supplier', label:'Προμηθευτής', options:supOpts()}, {name:'date', label:'Ημερομηνία', type:'date', required:1}, {name:'total', label:'Αξία τιμολογίου €', inputmode:'decimal', required:1}, {name:'amount', label:'Ποσό που πλήρωσα €', inputmode:'decimal', required:1}, {name:'src', label:'Πληρώθηκε από', options:srcOpts}], {name:x.name, supplier:x.supplier || '', date:x.date, total:x.total ?? x.amount, amount:x.amount, src:srcOf(x)});
    if(!v) return; const a = num(v.amount); if(a == null) return toast('Βάλε ποσό');
    if(!v.supplier) return toast('Διάλεξε προμηθευτή'); const t = num(v.total); if(t == null) return toast('Βάλε αξία τιμολογίου'); x.name = v.name; x.supplier = v.supplier; x.total = t; x.date = v.date || x.date; x.amount = a; x.src = v.src === 'bank' ? 'bank' : 'cash';
  }
  if(kind === 'sup'){ v = await formModal('Επεξεργασία προμηθευτή', [{name:'name', label:'Όνομα', required:1}, {name:'phone', label:'Τηλέφωνο', type:'tel', inputmode:'tel'}, {name:'days', label:'Ημέρες παράδοσης (π.χ. Δευ, Πεμ)'}], x); if(!v) return; x.name = v.name; x.phone = v.phone; x.days = v.days; }
  if(kind === 'sprice'){ v = await formModal('Επεξεργασία τιμής', [{name:'name', label:'Προϊόν', required:1}, {name:'price', label:'Τιμή €', inputmode:'decimal'}], {name:x.name, price:x.price ?? ''}); if(!v) return; x.name = v.name; x.price = num(v.price); }
  if(kind === 'z'){
    v = await formModal('Επεξεργασία Ζ', [{name:'date', label:'Ημερομηνία', type:'date', required:1}, {name:'z', label:'Ζ ταμειακής €', inputmode:'decimal', required:1}, {name:'pos', label:'Ζ POS €', inputmode:'decimal'}], {date:x.date, z:x.z, pos:x.pos || ''});
    if(!v) return; const a = num(v.z); if(a == null) return toast('Βάλε το Ζ');
    x.date = v.date || x.date; x.z = a; x.pos = num(v.pos) ?? 0;
  }
  if(kind === 'exp'){
    v = await formModal('Επεξεργασία εξόδου', [{name:'cat', label:'Κατηγορία', options:EXPCATS.map(c => [c, c])}, {name:'note', label:'Σημείωση'}, {name:'date', label:'Ημερομηνία', type:'date', required:1}, {name:'amount', label:'Ποσό €', inputmode:'decimal', required:1}, {name:'src', label:'Πληρώθηκε από', options:srcOpts}], {cat:x.cat, note:x.note || '', date:x.date, amount:x.amount, src:srcOf(x)});
    if(!v) return; const a = num(v.amount); if(a == null) return toast('Βάλε ποσό');
    x.cat = v.cat; x.note = v.note; x.date = v.date || x.date; x.amount = a; x.src = v.src === 'bank' ? 'bank' : 'cash';
  }
  x.ed = who(); save(); render(); toast('Αποθηκεύτηκε');
}

/* ---------- Φόρμες ---------- */
document.addEventListener('submit', ev => {
  const form = ev.target.closest('form[data-form]'); if(!form) return;
  ev.preventDefault();
  const f = new FormData(form), kind = form.dataset.form, by = who(), now = Date.now();
  const sg = kind + JSON.stringify([...f.entries()]);
  if(kind !== 'login' && sg === lastSub.s && now - lastSub.t < 2000) return;
  lastSub = {s:sg, t:now};
  if(kind === 'login') return doLogin(f);
  if(kind === 'newuser') return createUser(f);
  if(kind === 'need' || kind === 'sneed'){
    const text = val(f, 'text'); if(S.needs.some(n => !n.done && pk(n.text) === pk(text))) return toast('Υπάρχει ήδη στη λίστα');
    S.needs.unshift({id:uid(), text, supplier:kind === 'sneed' ? openSup : (val(f, 'supplier') || (S.sprices.find(x => pk(x.name) === pk(text)) || {}).supplier || undefined), by, at:now, done:false});
  }
  if(kind === 'task') S.tasks.push({id:uid(), text:val(f, 'text'), date:f.get('date') || today(), done:false, by, at:now});
  if(kind === 'sup') S.suppliers.push({id:uid(), name:val(f, 'name'), phone:val(f, 'phone'), days:val(f, 'days'), by});
  if(kind === 'sprice') S.sprices.push({id:uid(), supplier:openSup, name:val(f, 'name'), price:num(f.get('price')), by});
  if(kind === 'spay'){
    const a = num(f.get('amount')); if(a == null) return toast('Βάλε ποσό');
    S.spay.push({id:uid(), supplier:openSup, date:f.get('date') || today(), amount:a, src:f.get('src') === 'bank' ? 'bank' : 'cash', by, at:now});
  }
  if(kind === 'cash'){
    const a = num(f.get('amount')); if(a == null) return toast('Βάλε ποσό');
    const w = f.get('when'); S.cash.push({id:uid(), amount:a, by, at:w ? new Date(w).getTime() : now});
  }
  if(kind === 'debtor'){
    const nm = val(f, 'name'); if(S.debtors.some(c => norm(c.name) === norm(nm))) return toast('Υπάρχει ήδη πελάτης με αυτό το όνομα');
    S.debtors.push({id:uid(), name:nm});
  }
  if(kind === 'debt'){
    const c = S.debtors.find(x => x.id === openDebtor), pay = ev.submitter?.value === 'pay';
    let a = num(f.get('amount')), item = val(f, 'item');
    if(pay && a == null) return toast('Βάλε ποσό πληρωμής');
    if(!pay && a == null && !item) return toast('Βάλε προϊόν ή ποσό');
    S.entries.push({id:uid(), debtor:c.id, item, amount:a == null ? null : (pay ? -Math.abs(a) : Math.abs(a)), pay, by, at:now});
  }
  if(kind === 'prod') S.products.push({id:uid(), name:val(f, 'name'), price:num(f.get('price')), tags:normTags(f.get('tags')), by});
  if(kind === 'recv'){
    const a = num(f.get('amount')), tot = num(f.get('total'));
    if(!val(f, 'supplier')) return toast('Διάλεξε προμηθευτή'); if(tot == null) return toast('Βάλε αξία τιμολογίου'); if(a == null) return toast('Βάλε ποσό που πλήρωσες');
    S.receipts.push({id:uid(), name:val(f, 'name'), supplier:val(f, 'supplier'), total:tot, date:f.get('date') || today(), amount:a, src:f.get('src') === 'bank' ? 'bank' : 'cash', by, at:now});
  }
  if(kind === 'z'){
    const a = num(f.get('z')); if(a == null) return toast('Βάλε το Ζ της ταμειακής');
    S.zs.push({id:uid(), date:f.get('date') || today(), z:a, pos:num(f.get('pos')) ?? 0, by, at:now});
  }
  if(kind === 'exp'){
    if(!isAdmin()) return;
    const a = num(f.get('amount')); if(a == null) return toast('Βάλε ποσό');
    S.expenses.push({id:uid(), cat:f.get('cat') || 'Άλλο', note:val(f, 'note'), date:f.get('date') || today(), amount:a, src:f.get('src') === 'bank' ? 'bank' : 'cash', by, at:now});
  }
  if(kind === 'tel') S.contacts.push({id:uid(), name:val(f, 'name'), phone:val(f, 'phone'), note:val(f, 'note')});
  save(); render(); toast('Αποθηκεύτηκε');
});

/* ---------- Κλικ ---------- */
document.addEventListener('click', async ev => {
  const tb = ev.target.closest('[data-tab]'); if(tb) return go(tb.dataset.tab);
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(a.endsWith('Edit')) return editItem(a.slice(0, -4), id);
  switch(a){
    case 'needDone': { const n = S.needs.find(x => x.id === id); n.done = !n.done; n.od = n.done ? Date.now() : null; break; }
    case 'needDel': delItem('needs', id); return;
    case 'needClear': if(!await ask('Να σβηστούν οι παραγγελμένες;')) return; S.needs = S.needs.filter(n => !n.done); break;
    case 'needCopy': {
      const t = S.needs.filter(n => !n.done).map(n => '• ' + n.text).join('\n') || 'Δεν λείπει τίποτα';
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Αντιγράφηκε'), () => toast('Δεν έγινε αντιγραφή'));
      return;
    }
    case 'cashDel': delItem('cash', id); return;
    case 'openDebtor': openDebtor = id; q = ''; render(); window.scrollTo(0, 0); return;
    case 'back': openDebtor = null; break;
    case 'debtorDel': {
      if(!await ask('Διαγραφή πελάτη και όλων των κινήσεών του;', 'Διαγραφή')) return;
      const did = openDebtor; S.entries = S.entries.filter(e => e.debtor !== did);
      S.debtors = S.debtors.filter(c => c.id !== did); openDebtor = null; break;
    }
    case 'entryDel': delItem('entries', id); return;
    case 'prodDel': delItem('products', id); return;
    case 'recvDel': delItem('receipts', id); return;
    case 'zDel': delItem('zs', id); return;
    case 'expDel': delItem('expenses', id); return;
    case 'cview': cashView = id; render(); return;
    case 'tagmore': tagsAll = !tagsAll; render(); return;
    case 'prodNew': {
      const v = await formModal('Νέο προϊόν', [{name:'name', label:'Όνομα προϊόντος', required:1}, {name:'price', label:'Τιμή €', inputmode:'decimal'}, {name:'tags', label:'Ετικέτες (διάλεξε ή γράψε, με κόμμα)', chips:1}], {}, 'Προσθήκη');
      if(!v) return;
      S.products.push({id:uid(), name:v.name, price:num(v.price), tags:normTags(v.tags), by:who()});
      save(); render(); toast('Αποθηκεύτηκε'); return;
    }
    case 'nview': needsView = id; q = ''; render(); return;
    case 'tagpick': {
      const fm = b.closest('form'), inp = fm.querySelector('[name=tags]'), cur = tagsOf({tags:inp.value}), k = norm(id);
      inp.value = (cur.some(t => norm(t) === k) ? cur.filter(t => norm(t) !== k) : [...cur, id]).join(', ');
      syncTags(fm); return;
    }
    case 'needAdd': {
      const x = S.sprices.find(i => i.id === id); if(!x) return;
      if(inNeeds(x.name)) return toast('Είναι ήδη στις ελλείψεις');
      S.needs.unshift({id:uid(), text:x.name, supplier:x.supplier, by:who(), at:Date.now(), done:false});
      save(); render(); toast('Προστέθηκε στις ελλείψεις'); return;
    }
    case 'blur': hideAmts = !hideAmts; render(); return;
    case 'jumpTab': go(id); return;
    case 'hsup': jump('sup', {s:id, v:b.dataset.v}); return;
    case 'hdebt': jump('debt', {d:id}); return;
    case 'taskDone': { const x = S.tasks.find(i => i.id === id); x.done = !x.done; break; }
    case 'taskDel': delItem('tasks', id); return;
    case 'gs': gsOpen(); return;
    case 'supOpen': openSup = id; supView = 'order'; q = ''; render(); window.scrollTo(0, 0); return;
    case 'supBack': openSup = null; render(); return;
    case 'supv': supView = id; render(); return;
    case 'supCopy': {
      const t = S.needs.filter(n => n.supplier === openSup && !n.done).map(n => '• ' + n.text).join('\n') || 'Δεν λείπει τίποτα';
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Αντιγράφηκε'), () => toast('Δεν έγινε αντιγραφή')); return;
    }
    case 'supDel':
      if(!await ask('Διαγραφή προμηθευτή, τιμοκαταλόγου και πληρωμών του; Οι παραλαβές μένουν.', 'Διαγραφή')) return;
      S.sprices = S.sprices.filter(x => x.supplier !== openSup); S.spay = S.spay.filter(x => x.supplier !== openSup);
      S.suppliers = S.suppliers.filter(x => x.id !== openSup); openSup = null; break;
    case 'spayDel': delItem('spay', id); return;
    case 'spriceDel': delItem('sprices', id); return;
    case 'ptag': ptag = ptag === id ? '' : id; render(); return;
    case 'rep': repPeriod = id; render(); return;
    case 'telDel': delItem('contacts', id); return;
    case 'logout':
      if(remote && Object.keys(diff(remote, localMaps())).length && !await ask('Υπάρχουν αλλαγές που δεν έχουν σταλεί ακόμα. Έξοδος παρ’ όλα αυτά;')) return;
      logout(); return;
    case 'userDel': if(!await ask('Διαγραφή λογαριασμού; Δεν θα μπορεί πια να μπει.', 'Διαγραφή')) return; deleteUser(id); return;
    case 'export': {
      const a2 = document.createElement('a');
      a2.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}));
      a2.download = 'peripteros-' + new Date().toISOString().slice(0, 10) + '.json'; a2.click(); return;
    }
    case 'import': $('#file').click(); return;
    case 'wipe':
      if(!await ask(AUTH ? 'Σίγουρα; Θα σβηστούν ΟΛΑ για ΟΛΕΣ τις συσκευές.' : 'Σίγουρα; Θα σβηστούν ΟΛΑ.', 'Διαγραφή')) return;
      if(!await ask('Τελευταία ερώτηση: διαγραφή όλων των δεδομένων;', 'Ναι, διαγραφή')) return;
      S = blank(); break;
  }
  save(); render();
});
document.addEventListener('keydown', ev => {
  if((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-act="openDebtor"],[data-act="supOpen"],[data-act="hsup"],[data-act="hdebt"]')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', async ev => {
  if(ev.target.id !== 'file') return;
  const file = ev.target.files[0]; ev.target.value = ''; if(!file) return;
  if(AUTH && !await ask('Η φόρτωση αντικαθιστά τα κοινά δεδομένα για όλους. Συνέχεια;')) return;
  const r = new FileReader();
  r.onload = () => { try{ S = migrate(Object.assign(blank(), JSON.parse(r.result))); save(); render(); toast('Φορτώθηκε'); }catch(e){ toast('Μη έγκυρο αρχείο'); } };
  r.readAsText(file);
});
document.addEventListener('input', ev => {
  if(ev.target.matches('[data-search]')){ q = ev.target.value; toList(); }
  if(ev.target.name === 'tags'){ const fm = ev.target.closest('form'); if(fm) syncTags(fm); }
});
/* ---------- Λογαριασμοί και συγχρονισμός (Firebase, REST) ---------- */
const COLS = ['products','needs','cash','debtors','entries','contacts','receipts','zs','expenses','suppliers','sprices','spay','tasks'];
let remote = null, syncing = false, again = false, needRender = false, es = null, rp = null;
const clone = o => JSON.parse(JSON.stringify(o));
const toMap = arr => Object.fromEntries(arr.map(x => [x.id, x]));
const fromMap = o => Object.values(o || {});
const localMaps = () => { const m = {}; COLS.forEach(c => m[c] = toMap(S[c])); return m; };
const sig = o => JSON.stringify(o, (k, v) => v === null ? undefined : (v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.entries(v).sort()) : v));
function diff(a, b){
  const out = {};
  COLS.forEach(c => {
    const A = a[c] || {}, B = b[c] || {};
    for(const id in B) if(sig(A[id]) !== sig(B[id])) out[c + '/' + id] = B[id];
    for(const id in A) if(!(id in B)) out[c + '/' + id] = null;
  });
  return out;
}
const typing = () => document.activeElement && document.activeElement.matches && document.activeElement.matches('input');

/* όνομα χρήστη -> εσωτερικό email (δουλεύει και με ελληνικά, τόνους, κεφαλαία) */
const normName = n => n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ς/g, 'σ');
const hex = t => [...new TextEncoder().encode(t)].map(b => b.toString(16).padStart(2, '0')).join('');
const emailFor = n => 'u' + hex(normName(n)) + '@peripteros.app';
const isAdminName = n => normName(n) === normName(ADMIN_NAME);

function setRemote(v){ remote = v; try{ v ? localStorage.setItem(BKEY, JSON.stringify(v)) : localStorage.removeItem(BKEY); }catch(e){} }
function setStatus(st){
  const el = $('#sync'); if(!el) return;
  const n = st === 'offline' ? (remote ? Object.keys(diff(remote, localMaps())).length : 0) : 0;
  el.textContent = {off:'Μόνο σε αυτή τη συσκευή', ok:'● Συγχρονισμένο', offline:'● Χωρίς σύνδεση' + (n ? ' – ' + n + ' αλλαγές σε αναμονή' : '')}[st] || '';
}
function renderHeader(){
  const h = $('#hdr'); if(!h) return;
  if(!AUTH){
    h.innerHTML = '<button data-act="gs" aria-label="Αναζήτηση">🔍</button><label>Βάρδια <input id="who" placeholder="Όνομα" autocomplete="off" aria-label="Όνομα βάρδιας"></label>';
    const i = $('#who'); i.value = S.user; i.addEventListener('input', e => { S.user = e.target.value; save(); });
  } else if(session){
    h.innerHTML = `<button data-act="gs" aria-label="Αναζήτηση">🔍</button><span>${esc(session.name)}${isAdmin() ? ' (διαχειριστής)' : ''}</span><button data-act="logout">Έξοδος</button>`;
  } else h.innerHTML = '';
  if(!AUTH) setStatus('off'); else if(!session) setStatus('');
}
function loginView(){
  return `<form data-form="login" class="card grid" style="margin-top:24px"><h2 class="full" style="margin:0">Είσοδος</h2>
    <input class="full" name="user" placeholder="Όνομα χρήστη" autocomplete="username" autocapitalize="none" required>
    <input class="full" name="pass" type="password" placeholder="Κωδικός" autocomplete="current-password" required>
    <button class="primary">Είσοδος</button></form>`;
}
async function idp(ep, body){
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:' + ep + '?key=' + FIREBASE_API_KEY,
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...body, returnSecureToken:true})});
  return r.json();
}
async function refresh(){
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + FIREBASE_API_KEY, {method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(session.refreshToken)});
  const j = await r.json();
  if(j.error){ logout('Συνδέσου ξανά'); throw new Error('auth'); }
  tok = {id:j.id_token, exp:Date.now() + (+j.expires_in) * 1000};
  session.refreshToken = j.refresh_token; saveSession(); stream();
}
async function token(){
  if(!session) throw new Error('auth');
  if(Date.now() > tok.exp - 60000){ if(!rp) rp = refresh().finally(() => rp = null); await rp; }
  return tok.id;
}
async function api(method, path, body, retry = true){
  const t = await token();
  const r = await fetch(DB + path + '?auth=' + encodeURIComponent(t), {method, body: body === undefined ? undefined : JSON.stringify(body)});
  if(r.status === 401 && retry){ tok.exp = 0; return api(method, path, body, false); }
  if(r.status === 401){ logout('Δεν έχεις πρόσβαση. Ζήτα από τον διαχειριστή.'); throw new Error('auth'); }
  if(!r.ok) throw new Error(r.status);
  return r;
}
const saveSession = () => { try{ localStorage.setItem(SKEY, JSON.stringify(session)); }catch(e){} };
function logout(msg){
  if(es){ es.close(); es = null; }
  session = null; tok = {id:'', exp:0}; setRemote(null); users = null; again = false;
  localStorage.removeItem(SKEY); localStorage.removeItem(KEY);
  S = blank(); render(); if(msg) toast(msg);
}
async function doLogin(f){
  const name = (f.get('user') || '').trim(), pw = f.get('pass') || '';
  if(!name || !pw) return;
  toast('Σύνδεση…');
  try{
    const cred = {email:emailFor(name), password:pw + SALT};
    let r = await idp('signInWithPassword', cred);
    if(r.error && isAdminName(name) && /INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND/.test(r.error.message)){
      const r2 = await idp('signUp', cred);   // πρώτη είσοδος διαχειριστή: δημιουργείται ο λογαριασμός
      if(!r2.error) r = r2;
    }
    if(r.error){
      if(/OPERATION_NOT_ALLOWED/.test(r.error.message)) return toast('Ενεργοποίησε το Email/Password στο Firebase Authentication');
      if(/API key/i.test(r.error.message)) return toast('Λάθος API key στο index.html');
      return toast('Λάθος όνομα ή κωδικός');
    }
    tok = {id:r.idToken, exp:Date.now() + (+r.expiresIn) * 1000};
    session = {uid:r.localId, refreshToken:r.refreshToken, name, role:'user'};
    let u = await (await api('GET', '/users/' + r.localId + '.json')).json();
    if(!u){
      if(!isAdminName(name)){ logout('Ο λογαριασμός δεν έχει πρόσβαση. Ζήτα από τον διαχειριστή.'); return; }
      u = {name:ADMIN_NAME, role:'admin', created:Date.now()};
      await api('PUT', '/users/' + r.localId + '.json', u);
    }
    session.name = u.name; session.role = u.role === 'admin' ? 'admin' : 'user';
    saveSession(); tab = 'home'; render(); stream(); sync();
  }catch(e){ if(session && e.message !== 'auth') toast('Χωρίς σύνδεση στο internet'); else if(!session && e.message !== 'auth') toast('Χωρίς σύνδεση στο internet'); }
}
async function loadUsers(){
  try{ users = (await (await api('GET', '/users.json')).json()) || {}; if(tab === 'backup' && !typing()) render(); }catch(e){}
}
async function createUser(f){
  const name = (f.get('user') || '').trim(), pw = f.get('pass') || '';
  if(name.length < 2 || pw.length < 4) return toast('Όνομα 2+ και κωδικός 4+ χαρακτήρες');
  if(hex(normName(name)).length > 60) return toast('Πολύ μεγάλο όνομα');
  if(isAdminName(name)) return toast('Αυτό το όνομα είναι του διαχειριστή');
  try{
    const cred = {email:emailFor(name), password:pw + SALT};
    let r = await idp('signUp', cred);
    if(r.error){
      if(!/EMAIL_EXISTS/.test(r.error.message)) return toast('Δεν δημιουργήθηκε: ' + r.error.message);
      r = await idp('signInWithPassword', cred);   // ξαναενεργοποίηση λογαριασμού που είχε διαγραφεί
      if(r.error) return toast('Το όνομα υπάρχει ήδη με άλλον κωδικό (Firebase → Authentication)');
    }
    await api('PUT', '/users/' + r.localId + '.json', {name, role:'user', created:Date.now()});
    toast('Ο λογαριασμός δημιουργήθηκε'); loadUsers();
  }catch(e){ if(e.message !== 'auth') toast('Δεν έγινε. Έλεγξε το internet'); }
}
async function deleteUser(uid){
  if(session && uid === session.uid) return;
  try{ await api('DELETE', '/users/' + uid + '.json'); loadUsers(); toast('Διαγράφηκε'); }catch(e){ toast('Δεν έγινε'); }
}
function accountCard(){
  if(!AUTH) return `<div class="card"><p class="muted" style="margin:0">Λειτουργία χωρίς λογαριασμούς: τα δεδομένα μένουν μόνο σε αυτή τη συσκευή. Για κοινή χρήση δες το README.</p></div>`;
  let h = `<div class="card row"><div><h2>${esc(session.name)}</h2><div class="muted">${isAdmin() ? 'Διαχειριστής' : 'Χρήστης'}</div></div><button class="ghost" data-act="logout">Έξοδος</button></div>`;
  if(isAdmin()){
    const l = Object.entries(users || {}).sort((a, b) => String(a[1].name).localeCompare(String(b[1].name), 'el'));
    h += `<form data-form="newuser" class="card grid"><h2 class="full" style="margin:0">Νέος λογαριασμός</h2>
      <input class="full" name="user" placeholder="Όνομα χρήστη" autocomplete="off" autocapitalize="none" required>
      <input class="full" name="pass" placeholder="Κωδικός (4+ χαρακτήρες)" autocomplete="off" required>
      <button class="primary">Δημιουργία</button></form>
      <div class="card"><h2>Λογαριασμοί</h2>${users ? (l.length ? l.map(([id, u]) => `<div class="item row"><div><div class="t">${esc(u.name)}</div><div class="by">${u.role === 'admin' ? 'Διαχειριστής' : 'Χρήστης'}</div></div>
        ${u.role === 'admin' ? '' : `<button class="danger sm" data-act="userDel" data-id="${esc(id)}" aria-label="Διαγραφή λογαριασμού">✕</button>`}</div>`).join('') : '<div class="muted">Κανένας ακόμα.</div>') : '<div class="muted">Φόρτωση…</div>'}</div>`;
  }
  return h;
}

async function sync(){
  if(!AUTH || !session) return setStatus(AUTH ? '' : 'off');
  if(syncing){ again = true; return; }
  if(!navigator.onLine) return setStatus('offline');
  syncing = true;
  try{
    do{
      again = false;
      if(remote){
        const snap = localMaps(), d = diff(remote, snap);
        if(Object.keys(d).length){ await api('PATCH', '/data.json', d); setRemote(clone(snap)); }
      }
      const data = (await (await api('GET', '/data.json')).json()) || {}, sm = {};
      if(!session) break;
      COLS.forEach(c => sm[c] = data[c] || {});
      if(!remote){
        COLS.forEach(c => { const ids = new Set(Object.keys(sm[c])); S[c] = fromMap(sm[c]).concat(S[c].filter(x => !ids.has(x.id))); });
        setRemote(sm); needRender = true; again = true; continue;
      }
      if(Object.keys(diff(remote, localMaps())).length){ again = true; continue; }
      if(sig(sm) !== sig(localMaps())){ COLS.forEach(c => S[c] = fromMap(sm[c])); needRender = true; }
      setRemote(sm);
    }while(again);
    if(session){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} setStatus('ok'); }
  }catch(e){ setStatus(session ? 'offline' : ''); }
  finally{ syncing = false; }
  if(needRender && !typing()){ needRender = false; render(); }
}
function stream(){
  if(es){ es.close(); es = null; }
  if(!AUTH || !session || !tok.id || !window.EventSource) return;
  es = new EventSource(DB + '/data.json?auth=' + encodeURIComponent(tok.id));
  ['put', 'patch'].forEach(t => es.addEventListener(t, () => sync()));
  es.addEventListener('auth_revoked', () => { tok.exp = 0; sync(); });
}
function boot(){
  if(AUTH){ try{ session = JSON.parse(localStorage.getItem(SKEY)); }catch(e){} if(!session) S = blank(); }
  if(AUTH && session){ try{ remote = JSON.parse(localStorage.getItem(BKEY)); }catch(e){} }
  render();
  if(AUTH && session){ setStatus('offline'); sync(); }
}
setInterval(sync, 60000);
addEventListener('online', sync);
document.addEventListener('visibilitychange', () => { if(!document.hidden) sync(); });

boot();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- Καθολική αναζήτηση ---------- */
function jump(t, o = {}){ tab = t; q = o.q || ''; openDebtor = o.d || null; openSup = o.s || null; supView = o.v || 'order'; editId = null; render(); window.scrollTo(0, 0); }
function gsOpen(){
  const m = mk(`<div class="sheet"><div class="row"><input id="gsq" placeholder="Αναζήτηση παντού…" autocomplete="off"><button class="ghost" data-x>✕</button></div><div id="gsr" style="margin-top:10px"></div></div>`);
  let res = [];
  const run = () => {
    const t = m.querySelector('#gsq').value.trim(), has = x => fz(x, t); res = [];
    const add = (g, l, f) => l.slice(0, 8).forEach(x => res.push({g, ...f(x)}));
    if(t){
      add('Προϊόντα', S.products.filter(p => has(p.name + ' ' + (p.tags || ''))), p => ({t:p.name, s:p.price != null ? eur(p.price) : '', go:() => jump('prod', {q:p.name})}));
      add('Πελάτες', S.debtors.filter(c => has(c.name)), c => ({t:c.name, s:eur(owed(c)), go:() => jump('debt', {d:c.id})}));
      add('Προμηθευτές', S.suppliers.filter(x => has(x.name + ' ' + (x.phone || ''))), x => ({t:x.name, s:eur(supBal(x.id)), go:() => jump('sup', {s:x.id})}));
      add('Προϊόντα προμηθευτών', S.sprices.filter(x => has(x.name)), x => ({t:x.name, s:supName(x.supplier) + ' · ' + eur(x.price), go:() => jump('sup', {s:x.supplier, v:'prices'})}));
      add('Παραλαβές', S.receipts.filter(r => has(r.name + ' ' + supName(r.supplier))), r => ({t:r.name || supName(r.supplier) || 'Παραλαβή', s:dd(r.date) + ' · ' + eur(r.amount), go:() => r.supplier ? jump('sup', {s:r.supplier, v:'buys'}) : jump('recv', {q:r.name})}));
      if(isAdmin()) add('Έξοδα', S.expenses.filter(e => has(expName(e))), e => ({t:expName(e), s:dd(e.date) + ' · ' + eur(e.amount), go:() => jump('exp', {q:expName(e)})}));
      add('Ελλείψεις', S.needs.filter(n => has(n.text)), n => ({t:n.text, s:n.done ? 'παραγγέλθηκε' : 'λείπει', go:() => jump('needs')}));
      add('Τηλέφωνα', S.contacts.filter(c => has(c.name + ' ' + (c.phone || '') + ' ' + (c.note || ''))), c => ({t:c.name, s:c.phone || '', go:() => jump('tel', {q:c.name})}));
    }
    let last = '';
    m.querySelector('#gsr').innerHTML = res.length ? res.map((r, i) => (r.g !== last ? `<h2 class="muted" style="font-size:14px;margin:10px 0 4px">${(last = r.g)}</h2>` : '') + `<div class="item row" data-i="${i}" style="cursor:pointer"><div class="t">${esc(r.t)}</div><span class="by">${esc(r.s)}</span></div>`).join('') : empty(t ? 'Κανένα αποτέλεσμα.' : 'Γράψε για να ψάξεις.');
  };
  m.oninput = run;
  m.onclick = e => { if(e.target === m || e.target.closest('[data-x]')) return m.remove(); const it = e.target.closest('[data-i]'); if(it){ m.remove(); res[+it.dataset.i].go(); } };
  run(); setTimeout(() => m.querySelector('#gsq').focus(), 50);
}
</script>
